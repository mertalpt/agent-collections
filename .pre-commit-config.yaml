default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: commit-message
        name: Commit message format
        entry: python3 scripts/release.py check-message
        language: system
        stages: [commit-msg]
  - repo: https://github.com/mertalpt/agent-collections
    rev: intent-v0.3.0
    hooks:
      - id: intent-decisions
