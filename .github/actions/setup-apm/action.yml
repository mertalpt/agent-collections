name: Set up APM
description: Install a pinned, checksum-verified APM CLI on a Linux x86_64 runner.

inputs:
  version:
    description: APM release version, without the leading "v".
    default: 0.33.0
  sha256:
    description: SHA-256 of apm-linux-x86_64.tar.gz for that version.
    default: e6374402c74318f7c8bef97a90d8572d049fdab0dc3871492c6b0647ae9e881f

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APM_VERSION: ${{ inputs.version }}
        APM_SHA256: ${{ inputs.sha256 }}
      run: |
        archive="$RUNNER_TEMP/apm.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz"
        echo "${APM_SHA256}  $archive" | sha256sum -c -
        tar xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apm-linux-x86_64" >> "$GITHUB_PATH"
    - shell: bash
      run: apm --version
