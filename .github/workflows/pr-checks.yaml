name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - run: gh --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Check PR title and collections
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/release.py check-pr --base "$BASE" --head "$HEAD" --title "$TITLE"
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Install APM
        env:
          APM_VERSION: 0.33.0
          APM_SHA256: e6374402c74318f7c8bef97a90d8572d049fdab0dc3871492c6b0647ae9e881f
        run: |
          curl -fsSL -o "$RUNNER_TEMP/apm.tar.gz" \
            "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz"
          echo "${APM_SHA256}  $RUNNER_TEMP/apm.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/apm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apm-linux-x86_64" >> "$GITHUB_PATH"
      - name: Audit covered files for hidden Unicode
        # `apm audit --file` takes one file per call; xargs runs them all and fails if any fails.
        run: python3 scripts/release.py covered-files | xargs -r -d '\n' -n1 apm audit --file
